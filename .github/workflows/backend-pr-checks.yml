name: Project PR Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/casino/**"
      - ".github/workflows/backend-pr-checks.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/casino/**"
      - ".github/workflows/backend-pr-checks.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:ci

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/casino

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/casino/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
